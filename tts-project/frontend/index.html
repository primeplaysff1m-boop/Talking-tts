<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocalis — Free Unlimited Text to Speech</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9K7V2BCFHD"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-9K7V2BCFHD');
</script>
<style>
  :root{
    --bg:#10161a; --bg-deep:#0b1013; --surface:#182226; --surface-raised:#1f2b30;
    --bezel:#0d1417; --amber:#e8a33d; --teal:#5fcfc0; --text:#edeae2;
    --muted:#8b9a97; --line:#2a3438; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg);
    background-image:
      radial-gradient(ellipse at top, rgba(232,163,61,0.07), transparent 55%),
      radial-gradient(ellipse at bottom, rgba(95,207,192,0.05), transparent 55%);
    color:var(--text); font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; line-height:1.5;
  }
  .mono{ font-family:'IBM Plex Mono','JetBrains Mono',ui-monospace,monospace; }
  .hero{ max-width:880px; margin:0 auto; padding:64px 24px 32px; text-align:center; }
  .eyebrow{ font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.18em;
    color:var(--teal); text-transform:uppercase; margin-bottom:16px; }
  .eyebrow::before{ content:"● "; color:var(--amber); }
  h1{ font-size:clamp(30px,5vw,50px); line-height:1.05; margin:0 0 16px; letter-spacing:-.02em; font-weight:600; }
  h1 span{ color:var(--amber); }
  .sub{ color:var(--muted); font-size:16px; max-width:540px; margin:0 auto; }

  .panel-wrap{ max-width:880px; margin:36px auto 100px; padding:0 24px; }
  .panel{
    background:linear-gradient(180deg,var(--surface-raised),var(--surface));
    border:1px solid var(--line); border-radius:14px; padding:28px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--muted); margin-bottom:8px; }
  textarea{
    width:100%; min-height:120px; background:var(--bezel); border:1px solid var(--line);
    border-radius:8px; color:var(--text); font-size:15px; padding:14px; resize:vertical; font-family:inherit;
  }
  textarea:focus, select:focus, input:focus, button:focus{ outline:2px solid var(--teal); outline-offset:2px; }
  .charcount{ text-align:right; font-size:12px; color:var(--muted); font-family:'IBM Plex Mono',monospace; margin-top:6px; }

  .controls-row{ display:grid; grid-template-columns:1fr 1.4fr 1fr; gap:20px; margin:22px 0; }
  @media (max-width:640px){ .controls-row{ grid-template-columns:1fr; } }
  select{ width:100%; background:var(--bezel); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:14px; }
  .dial-value{ color:var(--amber); font-family:'IBM Plex Mono',monospace; }
  input[type=range]{ width:100%; accent-color:var(--amber); }

  .action-row{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  button{ font-family:'IBM Plex Mono',monospace; font-size:14px; letter-spacing:.03em; border-radius:8px;
    padding:13px 22px; border:1px solid var(--line); cursor:pointer; transition:transform .1s ease,background .15s ease; }
  button:active{ transform:scale(0.98); }
  button:disabled{ opacity:.45; cursor:not-allowed; }
  #generateBtn{ background:var(--amber); color:#1a1207; border:none; font-weight:600; }
  #generateBtn:hover:not(:disabled){ background:#f0ae4d; }
  #downloadBtn{ background:transparent; color:var(--teal); border:1px solid var(--teal); }
  #downloadBtn:hover:not(:disabled){ background:rgba(95,207,192,0.1); }

  audio{ width:100%; margin-top:18px; display:none; }
  .status-line{ font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--muted); margin-top:10px; }
  .footnote{ text-align:center; color:var(--muted); font-size:12.5px; margin-top:20px; font-family:'IBM Plex Mono',monospace; }
  .footnote a{ color:var(--teal); text-decoration:none; }
  .footnote a:hover{ text-decoration:underline; }
</style>
</head>
<body>

  <section class="hero">
    <div class="eyebrow mono">free · unlimited · 300+ voices</div>
    <h1>Give your text <span>a voice.</span></h1>
    <p class="sub">Free, unlimited text-to-speech powered by Microsoft's neural voices — no signup, no per-character cost.</p>
  </section>

  <div class="panel-wrap">
    <div class="panel">
      <label for="text">Your text</label>
      <textarea id="text" placeholder="Type or paste what you want spoken aloud...">Kindness is a language the deaf can hear and the blind can see.</textarea>
      <div class="charcount"><span id="charcount">0</span> / 5000 characters</div>

      <div class="controls-row">
        <div>
          <label for="language">Language</label>
          <select id="language"><option>Loading…</option></select>
        </div>
        <div>
          <label for="voice">Voice</label>
          <select id="voice"><option>Loading…</option></select>
        </div>
        <div>
          <label for="speed">Speed — <span class="dial-value" id="speedVal">1.0x</span></label>
          <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">
        </div>
      </div>

      <div class="action-row">
        <button id="generateBtn" disabled>▶ Generate Speech</button>
        <button id="downloadBtn" disabled>⬇ Download MP3</button>
      </div>

      <div class="status-line" id="statusLine">Connecting to voice server…</div>
      <audio id="player" controls></audio>
    </div>

    <p class="footnote">
      Free · Unlimited · No signup required
    </p>
  </div>

<script>
  const API_BASE = "https://vocalis-tts.vercel.app";

  const textEl = document.getElementById('text');
  const charcountEl = document.getElementById('charcount');
  const languageEl = document.getElementById('language');
  const voiceEl = document.getElementById('voice');
  const speedEl = document.getElementById('speed');
  const speedValEl = document.getElementById('speedVal');
  const generateBtn = document.getElementById('generateBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const statusLine = document.getElementById('statusLine');
  const player = document.getElementById('player');

  let allVoices = [];
  let lastUrl = null;

  textEl.addEventListener('input', () => charcountEl.textContent = textEl.value.length);
  charcountEl.textContent = textEl.value.length;

  speedEl.addEventListener('input', () => {
    speedValEl.textContent = parseFloat(speedEl.value).toFixed(1) + 'x';
  });

  function populateVoicesForLanguage(){
    const loc = languageEl.value;
    voiceEl.innerHTML = '';
    const filtered = allVoices.filter(v => v.locale === loc);
    for(const v of filtered){
      const opt = document.createElement('option');
      opt.value = v.id;
      opt.textContent = `${v.name} — ${v.gender}`;
      voiceEl.appendChild(opt);
    }
  }

  async function loadVoices(){
    try{
      const res = await fetch(`${API_BASE}/voices`);
      if(!res.ok) throw new Error('Server error');
      allVoices = await res.json();

      const locales = [...new Set(allVoices.map(v => v.locale))].sort();
      languageEl.innerHTML = '';
      for(const loc of locales){
        const opt = document.createElement('option');
        opt.value = loc;
        opt.textContent = loc;
        languageEl.appendChild(opt);
      }
      languageEl.value = locales.find(l => l.startsWith('en-US')) || locales[0];
      populateVoicesForLanguage();

      statusLine.textContent = `Connected — ${allVoices.length} voices available.`;
      generateBtn.disabled = false;
    } catch(err){
      statusLine.textContent = `Could not reach backend at ${API_BASE}. Is it running?`;
      console.error(err);
    }
  }

  languageEl.addEventListener('change', populateVoicesForLanguage);

  async function generate(){
    const text = textEl.value.trim();
    if(!text) return;

    const speed = parseFloat(speedEl.value);
    const ratePct = Math.round((speed - 1) * 100);
    const rate = (ratePct >= 0 ? '+' : '') + ratePct + '%';

    generateBtn.disabled = true;
    generateBtn.textContent = '● Generating…';
    statusLine.textContent = 'Generating speech…';

    try{
      const res = await fetch(`${API_BASE}/speak`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, voice: voiceEl.value, rate })
      });
      if(!res.ok){
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || 'Generation failed');
      }
      const blob = await res.blob();
      if(lastUrl) URL.revokeObjectURL(lastUrl);
      lastUrl = URL.createObjectURL(blob);

      player.src = lastUrl;
      player.style.display = 'block';
      player.play();
      downloadBtn.disabled = false;
      statusLine.textContent = 'Done.';
    } catch(err){
      statusLine.textContent = 'Error: ' + err.message;
      console.error(err);
    } finally {
      generateBtn.disabled = false;
      generateBtn.textContent = '▶ Generate Speech';
    }
  }

  generateBtn.addEventListener('click', generate);
  downloadBtn.addEventListener('click', () => {
    if(!lastUrl) return;
    const a = document.createElement('a');
    a.href = lastUrl;
    a.download = 'speech.mp3';
    a.click();
  });

  loadVoices();
</script>

</body>
</html>
